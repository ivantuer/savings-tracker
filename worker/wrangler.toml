name = "savings-sync"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "savings-sync"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# OAuth client ID from Google Cloud (it is public, not a secret). Tokens issued for any other client are refused.
GOOGLE_CLIENT_ID = ""
# Optional comma-separated list of Google emails allowed to use this server.
# When empty, the first Google account that signs in becomes the owner and nobody else can.
ALLOWED_EMAILS = ""
